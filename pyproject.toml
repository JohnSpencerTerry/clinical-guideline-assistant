[project]
name = "cga"
version = "0.1.0"
description = "Clinical Guideline Assistant — grounded Q&A over Type 2 Diabetes clinical guidelines (LangChain/LangGraph learning project)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "langchain",
    "langchain-openai",
    "langgraph",
    "langsmith",
    "langchain-chroma",
    "chromadb",
    "pydantic",
    "pydantic-settings",
    "streamlit",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cga"]

[tool.pytest.ini_options]
testpaths = ["tests"]
